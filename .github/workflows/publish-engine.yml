# Build @opensuitehq/engine (N-API) native bindings for the five initial platforms.
# Assembles npm packages, packs tarballs, and publishes via npm Trusted Publishing (OIDC).
# No long-lived NPM_TOKEN — publish uses GitHub Actions OIDC only.
#
# Triggers:
# - workflow_dispatch (manual; dry_run=true by default skips npm publish)
# - push of tags matching v*.*.* (e.g. v0.1.1) — always publishes

name: Publish engine

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Assemble and pack only; skip npm publish (safe default)
        type: boolean
        default: true
  push:
    tags:
      - "v*.*.*"

env:
  DEBUG: napi:*
  APP_NAME: opensuite_node
  WORKING_DIRECTORY: crates/opensuite-node

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            target: aarch64-apple-darwin
            artifact: opensuite_node.darwin-arm64.node
            build: npm run build -- --target aarch64-apple-darwin
          - host: macos-latest
            target: x86_64-apple-darwin
            artifact: opensuite_node.darwin-x64.node
            build: npm run build -- --target x86_64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: opensuite_node.linux-x64-gnu.node
            build: npm run build -- --target x86_64-unknown-linux-gnu --use-napi-cross
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            artifact: opensuite_node.linux-arm64-gnu.node
            build: npm run build -- --target aarch64-unknown-linux-gnu --use-napi-cross
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: opensuite_node.win32-x64-msvc.node
            build: npm run build -- --target x86_64-pc-windows-msvc
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/opensuite-node/package-lock.json

      # Must match rust-toolchain.toml so matrix targets land on the toolchain cargo actually uses.
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.napi-rs
            target/
          key: engine-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install npm deps
        run: npm ci

      - name: Build native binding
        run: ${{ matrix.build }}

      - name: Verify artifact exists
        shell: bash
        run: |
          if [ ! -f "${{ matrix.artifact }}" ]; then
            echo "Missing expected artifact: ${{ matrix.artifact }}"
            ls -la . || true
            exit 1
          fi
          echo "Found ${{ matrix.artifact }} ($(wc -c < "${{ matrix.artifact }}") bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: ${{ env.WORKING_DIRECTORY }}/${{ matrix.artifact }}
          if-no-files-found: error

  publish:
    name: publish
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm ≥ 11.5.1 required for Trusted Publishing / OIDC.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: crates/opensuite-node/package-lock.json
          registry-url: https://registry.npmjs.org

      - name: Verify npm supports Trusted Publishing
        run: |
          node --version
          npm --version
          npm --version | awk -F. '{ if ($1 < 11 || ($1 == 11 && $2 < 5) || ($1 == 11 && $2 == 5 && $3 < 1)) { print "npm >= 11.5.1 required for Trusted Publishing"; exit 1 } }'

      - name: Install npm deps
        run: npm ci

      - name: Create npm dirs
        run: npm run create-npm-dirs

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ env.WORKING_DIRECTORY }}/artifacts

      - name: Move artifacts into packages
        run: npm run artifacts -- --output-dir artifacts --npm-dir npm

      - name: List packages
        run: ls -R ./npm

      - name: Pack tarballs (dry-run validation, no publish)
        run: npm run pack:dry-run

      - name: Upload npm tarballs
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: ${{ env.WORKING_DIRECTORY }}/dist-tarballs/*.tgz
          if-no-files-found: error

      # setup-node writes `:_authToken=${NODE_AUTH_TOKEN}` when registry-url is set.
      # An empty token blocks OIDC Trusted Publishing; remove it before publish.
      - name: Prepare npmrc for OIDC
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          NPMRC="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$NPMRC" ]; then
            sed -i '/_authToken/d' "$NPMRC"
            echo "npmrc after stripping _authToken:"
            cat "$NPMRC" || true
          fi

      - name: Publish platform packages then root (OIDC)
        if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
        run: |
          set -euo pipefail
          for dir in npm/*/; do
            name="$(node -p "require('./${dir}package.json').name")"
            version="$(node -p "require('./${dir}package.json').version")"
            echo "Publishing ${name}@${version} from ${dir}"
            npm publish "${dir}" --access public
          done
          # Inject platform optionalDependencies into package.json (napi-rs standard).
          # pack:dry-run restores the committed manifest afterward, so re-inject here
          # before publishing the root. Platforms are already on the registry.
          npx napi prepublish -t npm --skip-optional-publish
          root_name="$(node -p "require('./package.json').name")"
          root_version="$(node -p "require('./package.json').version")"
          echo "Publishing ${root_name}@${root_version} (root, ignore-scripts)"
          # Skip prepublishOnly — platforms already published; optionals just injected.
          npm publish --access public --ignore-scripts

      - name: Skip publish (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != false }}
        run: |
          echo "dry_run=true — assembled packages and uploaded tarballs; skipped npm publish."
          echo "Re-run with dry_run=false or push a new v*.*.* tag to publish via OIDC."
